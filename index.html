<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src 'self' blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Rhythm Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Little Rhythm Board</h1>
<p class="hint">Tap a pad to hear it, or draw a beat below!</p>
<div id="board" class="board" role="group" aria-label="Rhythm pads"></div>
<div id="grid" class="grid" role="group" aria-label="Beat sequencer"></div>
<div id="dots" class="dots" aria-hidden="true"></div>
<div class="controls">
<button id="play" class="play" type="button">Play beat</button>
<button id="scrape" class="play alt" type="button" aria-pressed="false">Scrape pattern: off</button>
<label class="speed" for="speed">Speed <input id="speed" type="range" min="60" max="200" step="1" value="110"> <span id="bpmout">110 BPM</span></label>
</div>
</main>
<script src="board.js"></script>
</body>
</html>
